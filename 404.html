<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Page not found | Graded Prompts</title>
<meta name="description" content="This page does not exist.">
<meta name="robots" content="noindex">
<style>
:root{--bg:#f8fafc;--card:#ffffff;--text:#0f172a;--muted:#475569;--line:#e2e8f0;--accent:#0d9488;--accent-text:#ffffff;--link:#0f766e}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111a2e;--text:#e2e8f0;--muted:#94a3b8;--line:#1e293b;--accent:#14b8a6;--accent-text:#042f2e;--link:#5eead4}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--link)}
header,main,footer{max-width:1120px;margin:0 auto;padding:0 16px}
header{padding-top:20px;padding-bottom:4px}
.brand{font-weight:700;text-decoration:none;color:var(--text)}
h1{font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.2;margin:28px 0 10px}
.lede{color:var(--muted);max-width:46rem;margin:0 0 28px}
.grid{list-style:none;margin:0;padding:0;display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{display:block;aspect-ratio:16/9;background:var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
h2{font-size:1.15rem;margin:0}
h2 a{color:inherit;text-decoration:none}
.tool{color:var(--muted);font-size:.875rem;margin:2px 0 8px}
.blurb{margin:0 0 14px;flex:1}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:0;font-size:.95rem}
.play{background:var(--accent);color:var(--accent-text);text-decoration:none;font-weight:600;padding:8px 18px;border-radius:999px}
.soon{color:var(--muted)}
footer{color:var(--muted);font-size:.875rem;padding-top:36px;padding-bottom:36px}
footer p{margin:4px 0}
</style>
</head>
<body>
<header><a class="brand" href="https://www.gradedprompts.com/">Graded Prompts</a></header>
<main>
<h1>Page not found</h1>
<p class="lede">There is no game at this address. <a href="/">See every game</a> or browse the <a href="https://www.gradedprompts.com/prompts/apps">app &amp; game prompts</a>.</p>
</main>
<footer>
<p>Each demo is one HTML file, unedited after the agent finished, and its source is public on GitHub.</p>
<p><a href="https://www.gradedprompts.com/prompts/apps">App &amp; game prompts</a> · <a href="https://www.gradedprompts.com/legal/privacy-policy">Privacy</a> · Hosted on GitHub Pages</p>
</footer>
</body>
</html>
